name: Update

on:
  # Runs at 10:00 UTC every day
  schedule:
    - cron: "0 10 * * *"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: 🔄 Sync version with upstream
    environment: "Candidate Branch"
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Sync version with upstream
        uses: snapcrafters/ci/sync-version@main
        with:
          token: ${{ secrets.SNAPCRAFTERS_BOT_COMMIT }}
          update-script: |
            VERSION="$(curl -fsSL https://api.github.com/repos/obsproject/obs-studio/releases/latest \
              | jq -r '.tag_name')"
            sed -i 's/^\(version: &obs-version \).*$/\1'\"$VERSION\"'/' snap/snapcraft.yaml

            # update the CEF binary based on the CMakePresets.json of the
            # selected obs-studio release
            CEF_JSON="$(curl -fsSL "https://raw.githubusercontent.com/obsproject/obs-studio/${VERSION}/CMakePresets.json" \
              | jq -r '.configurePresets[] | select(.name=="dependencies") | .vendor["obsproject.com/obs-studio"].dependencies.cef')"
            CEF_BASEURL="$(echo "$CEF_JSON" | jq -r '.baseUrl')"
            CEF_VERSION="$(echo "$CEF_JSON" | jq -r '.version')"
            CEF_HASH="$(echo "$CEF_JSON" | jq -r '.hashes["ubuntu-x86_64"]')"
            CEF_REVISION="$(echo "$CEF_JSON" | jq -r '.revision["ubuntu-x86_64"]')"
            CEF_URL="${CEF_BASEURL}/cef_binary_${CEF_VERSION}_linux_x86_64_v${CEF_REVISION}.tar.xz"

            sed -i "s|^\(    source: \).*cef_binary_.*\$|\1${CEF_URL}|" snap/snapcraft.yaml
            sed -i "s|^\(    source-checksum: sha256/\).*\$|\1${CEF_HASH}|" snap/snapcraft.yaml
