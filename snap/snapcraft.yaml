name: obs-studio
summary: Live streaming and video recording software
description: Free and open source software for video capturing, recording, and live
  streaming.
version: "31.0.3"
base: core24
grade: stable
confinement: strict
license: GPL-2.0
compression: lzo

platforms:
  amd64:

layout:
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pulseaudio:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pulseaudio

plugs:
  intel-npu:
    interface: custom-device
    custom-device: intel-npu-device
  npu-libs:
    interface: content
    content: npu-libs-2404
    target: $SNAP/npu-libs
  openvino-libs:
    interface: content
    content: openvino-libs-2404
    target: $SNAP/openvino

components:
  openvino-plugins:
    type: standard
    summary: OpenVINO AI plugins
    description: OpenVINO based plugins that add AI features to OBS Studio

parts:
  launcher:
    plugin: dump
    source: snap/local
  obs-studio:
    source: https://ppa.launchpadcontent.net/obsproject/obs-studio/ubuntu/pool/main/o/obs-studio/obs-studio_31.0.3-0obsproject1~noble_amd64.deb
    build-attributes:
      # OBS Studio currently does not forward environment variables to
      # subprocesses, so they don't get LD_LIBRARY_PATH. To get the right paths
      # to libraries, patchelf is used to modify the ELF rpath.
      # (https://github.com/obsproject/obs-studio/issues/12246)
      # Note: this might be redundant after the 31.1 version is released
      - enable-patchelf
    source-type: deb
    plugin: dump
  deps:
    plugin: nil
    stage-packages:
      - ffmpeg
      - libavcodec60
      - libavdevice60
      - libavfilter9
      - libavformat60
      - libavutil58
      - libblas3
      - libc6
      - libcurl4
      - libfdk-aac2
      - libfontconfig1
      - libfreetype6
      - libgcc-s1
      - libgdk-pixbuf-2.0-0
      - libglx0
      - libjansson4
      - liblapack3
      - libluajit-5.1-2
      - libmbedcrypto7t64
      - libmbedtls14t64
      - libmbedx509-1t64
      - libopengl0
      - libpci3
      - libpostproc57
      - libpulse0
      - libpython3.12t64
      - libqrcodegencpp1
      - libqt6core6t64
      - libqt6gui6t64
      - libqt6network6t64
      - libqt6svg6
      - libqt6widgets6t64
      - libqt6xml6t64
      - librist4
      - librsvg2-common
      - libspeexdsp1
      - libsrt1.5-openssl
      - libstdc++6
      - libswresample4
      - libswscale7
      - libudev1
      - libv4l-0t64
      - libva2
      - libva-drm2
      - libvlc5
      - libvlc5
      - libx11-6
      - libx264-164
      - libxcb1
      - libxcb-composite0
      - libxcb-randr0
      - libxcb-shm0
      - libxcb-xfixes0
      - libxcb-xinerama0
      - libxkbcommon0
      - pulseaudio
      - python3
      - python3.12
      - qt6-image-formats-plugins
      - qt6-qpa-plugins
      - qt6-wayland
      - stterm
      - vlc-plugin-base
  openvino-plugins:
    source: https://github.com/intel/openvino-plugins-for-obs-studio.git
    source-type: git
    plugin: dump
    after: [ 'obs-studio' ]
    build-environment:
      - OpenVINO_DIR: /snap/openvino-toolkit-2404/current/usr/lib/x86_64-linux-gnu/cmake/openvino2025.1.0/
    build-packages:
      - libopencv-dev
    build-snaps:
      - openvino-toolkit-2404
    override-build: |
      set -eux
      cd $CRAFT_PART_BUILD
      cmake .
      CORES="$(nproc)"
      make -j$CORES
      cp $CRAFT_PART_BUILD/intel64/Release/lib/*.so $CRAFT_PART_INSTALL/
      mkdir $CRAFT_PART_INSTALL/{obs-smart-framing-ov,obs-face-mesh-ov,obs-backgroundconcealment-ov}
      cp -R openvino-models/ $CRAFT_PART_INSTALL/
    organize:
      libobs-backgroundconcealment-ov.so: (component/openvino-plugins)
      libobs-face-mesh-ov.so: (component/openvino-plugins)
      libobs-smart-framing-ov.so: (component/openvino-plugins)
      obs-smart-framing-ov: (component/openvino-plugins)/obs-smart-framing-ov
      obs-face-mesh-ov: (component/openvino-plugins)/obs-face-mesh-ov
      obs-backgroundconcealment-ov: (component/openvino-plugins)/obs-backgroundconcealment-ov
      openvino-models: (component/openvino-plugins)/openvino-models
    stage-packages:
      - libopencv-imgproc406t64
      - libopencv-imgcodecs406t64
      - libopencv-core406t64
      - libtbb12

apps:
  obs-studio:
    command: obs-wrapper
    extensions: [gnome]
    environment:
      QT_PLUGIN_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6/plugins:$QT_PLUGIN_PATH
      QT_QPA_PLATFORM_PLUGIN_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6/plugins/platforms
      LD_LIBRARY_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pulseaudio:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/obs-plugins:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/obs-scripting:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/blas:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/lapack:$SNAP/npu-libs:$LD_LIBRARY_PATH
      OBS_PLUGINS_PATH: $SNAP/../components/$SNAP_REVISION/openvino-plugins
      OBS_PLUGINS_DATA_PATH: $SNAP/../components/$SNAP_REVISION/openvino-plugins
    plugs:
      - alsa
      - audio-playback
      - audio-record
      - avahi-control
      - browser-support
      - camera
      - desktop
      - desktop-legacy
      - gsettings
      - home
      - hardware-observe
      - jack1
      - joystick
      - kernel-module-observe
      - network
      - network-bind
      - opengl
      - password-manager-service
      - process-control
      - pulseaudio
      - raw-usb
      - removable-media
      - screen-inhibit-control
      - screencast-legacy
      - system-observe
      - unity7
      - upower-observe
      - wayland
      - x11
      - intel-npu
      - npu-libs
