name: obs-studio
summary: Live streaming and video recording software
description: Free and open source software for video capturing, recording, and live
  streaming.
version: "31.1.1"
base: core24
grade: stable
confinement: strict
license: GPL-2.0
compression: lzo

platforms:
  amd64:

layout:
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/intel-opencl:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/intel-opencl

package-repositories:
  - type: apt
    ppa: obsproject/obs-studio
    priority: prefer
    key-id: BC7345F522079769F5BBE987EFC71127F425E228
  - type: apt
    ppa: kobuk-team/intel-graphics
    priority: prefer
    key-id: 0C0E6AF955CE463C03FC51574D098D70AFBE5E1F

plugs:
  ffmpeg-2404:
    interface: content
    target: ffmpeg-platform
    default-provider: ffmpeg-2404
  intel-npu:
    interface: custom-device
    custom-device: intel-npu-device
  npu-libs:
    interface: content
    content: npu-libs-2404
    target: $SNAP/npu-libs

components:
  openvino-plugins:
    type: standard
    summary: OpenVINO AI plugins
    description: OpenVINO based plugins that add AI features to OBS Studio

parts:
  launcher:
    plugin: dump
    source: snap/local

  obs-studio:
    plugin: nil
    stage-packages:
      - obs-studio
      - libvlc5
      - vlc-plugin-base

  intel-graphics:
    plugin: nil
    stage-packages:
      - clinfo
      - intel-gsc
      - intel-level-zero-gpu
      - intel-media-va-driver-non-free
      - intel-metrics-discovery
      - intel-ocloc
      - intel-ocloc-dev
      - intel-opencl-icd
      - libigc2
      - libigc-dev
      - libigc-tools
      - libigdfcl2
      - libigdfcl-dev
      - libigdgmm12
      - libigdgmm-dev
      - libmfx1
      - libmfx-gen1
      - libmfx-gen-dev
      - libva-dev
      - libva-drm2
      - libva-glx2
      - libva-wayland2
      - libva-x11-2
      - libvpl2
      - libvpl-dev
      - libze1
      - libze-dev
      - libze-intel-gpu1
      - libze-intel-gpu-dev
      - ocl-icd-libopencl1
      - vainfo

  openvino-plugins:
    source: https://github.com/intel/openvino-plugins-for-obs-studio.git
    source-type: git
    plugin: dump
    after: [ 'obs-studio' ]
    build-environment:
      - OpenVINO_DIR: /snap/openvino-toolkit-2404/current/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/cmake/
    build-packages:
      - libopencv-dev
      - cmake
    build-snaps:
      - openvino-toolkit-2404/latest/stable
    override-build: |
      set -eux
      cd $CRAFT_PART_BUILD
      cmake .
      CORES="$(nproc)"
      make -j$CORES
      cp $CRAFT_PART_BUILD/intel64/Release/lib/*.so $CRAFT_PART_INSTALL/
      mkdir $CRAFT_PART_INSTALL/{obs-smart-framing-ov,obs-face-mesh-ov,obs-backgroundconcealment-ov}
      cp -R openvino-models/ $CRAFT_PART_INSTALL/
    organize:
      libobs-backgroundconcealment-ov.so: (component/openvino-plugins)/obs-plugins/
      libobs-face-mesh-ov.so: (component/openvino-plugins)/obs-plugins/
      libobs-smart-framing-ov.so: (component/openvino-plugins)/obs-plugins/
      obs-smart-framing-ov: (component/openvino-plugins)/obs-plugins/obs-smart-framing-ov
      obs-face-mesh-ov: (component/openvino-plugins)/obs-plugins/obs-face-mesh-ov
      obs-backgroundconcealment-ov: (component/openvino-plugins)/obs-plugins/obs-backgroundconcealment-ov
      openvino-models: (component/openvino-plugins)/obs-plugins/openvino-models
      usr: (component/openvino-plugins)/usr
    stage-packages:
      - libopencv-imgproc406t64
      - libopencv-imgcodecs406t64
      - libopencv-core406t64
      - libtbb12
    stage-snaps:
      - openvino-toolkit-2404/latest/stable

apps:
  obs-studio:
    command: obs-wrapper
    extensions: [gnome]
    environment:
      QT_PLUGIN_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6/plugins:$QT_PLUGIN_PATH
      QT_QPA_PLATFORM_PLUGIN_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6/plugins/platforms
      LD_LIBRARY_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pulseaudio:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/obs-plugins:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/obs-scripting:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/blas:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/lapack:$SNAP/ffmpeg-platform/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/npu-libs:$SNAP/../components/$SNAP_REVISION/openvino-plugins/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/../components/$SNAP_REVISION/openvino-plugins/usr/lib:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/intel-opencl:$LD_LIBRARY_PATH
      PATH: $SNAP/ffmpeg-platform/usr/bin:$PATH
      LIBVA_DRIVERS_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/dri:$LIBVA_DRIVERS_PATH
      OBS_PLUGINS_PATH: $SNAP/../components/$SNAP_REVISION/openvino-plugins/obs-plugins
      OBS_PLUGINS_DATA_PATH: $SNAP/../components/$SNAP_REVISION/openvino-plugins/obs-plugins
      OCL_ICD_VENDORS: $SNAP/etc/OpenCL/vendors
    plugs:
      - alsa
      - audio-playback
      - audio-record
      - avahi-control
      - browser-support
      - camera
      - desktop
      - desktop-legacy
      - gsettings
      - home
      - hardware-observe
      - jack1
      - joystick
      - kernel-module-observe
      - network
      - network-bind
      - opengl
      - password-manager-service
      - process-control
      - pulseaudio
      - raw-usb
      - removable-media
      - screen-inhibit-control
      - screencast-legacy
      - system-observe
      - unity7
      - upower-observe
      - wayland
      - x11
      - intel-npu
      - npu-libs
